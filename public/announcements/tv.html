<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELECTRICAL MAINTENANCE - Public TV Display</title>
  <link rel="icon" type="image/png" href="/Logo%20small.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .tv-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Top Bar Header */
    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 28px;
      background: #090d16;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-transform: uppercase;
    }

    .header-brand svg {
      color: #f59e0b;
    }

    .header-clock {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .clock-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.04em;
    }

    .clock-date {
      font-size: 17px;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Main Split Layout */
    .tv-main-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      padding: 20px;
      min-height: 0;
    }

    .tv-main-body.no-sidebar {
      grid-template-columns: 1fr;
    }

    /* Left Slideshow Box */
    .slideshow-container {
      position: relative;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-item {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .slide-item.active {
      opacity: 1;
      z-index: 2;
    }

    .slide-item img,
    .slide-item video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Slide Navigation Dots Overlay */
    .slideshow-dots {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #38bdf8;
      transform: scale(1.3);
    }

    /* Right Safety Counter Cards Sidebar */
    .safety-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .safety-card {
      background: #0a1120;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-header-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .days-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 58px;
      font-weight: 800;
      color: #22c55e;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    .days-unit {
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 16px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #22c55e);
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .target-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13.5px;
      color: #e2e8f0;
    }

    .target-badge strong {
      color: #38bdf8;
    }

    .last-date-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
    }

    .empty-slide-msg {
      color: #64748b;
      font-size: 18px;
      text-align: center;
    }

    /* Fullscreen Toggle Button */
    .fullscreen-btn {
      background: rgba(15, 23, 42, 0.7);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .fullscreen-btn:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(15, 23, 42, 0.95);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="tv-wrapper">
    <!-- Header -->
    <header class="tv-header" id="tv-header">
      <div class="header-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>ELECTRICAL MAINTENANCE</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="header-clock" id="clock-container">
          <div class="clock-time" id="clock-time">00:00:00</div>
          <div class="clock-date" id="clock-date">--</div>
        </div>
        <button class="fullscreen-btn" id="btn-fullscreen" title="ขยายเต็มหน้าจอ (Toggle Fullscreen)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="tv-main-body" id="tv-main-body">
      <!-- Left Slideshow -->
      <div class="slideshow-container" id="slideshow-container">
        <div class="empty-slide-msg" id="empty-msg">กำลังโหลดข้อมูลสื่อ...</div>
        <div class="slideshow-dots" id="slideshow-dots"></div>
      </div>

      <!-- Right Safety Counter -->
      <aside class="safety-sidebar" id="safety-sidebar">
        <!-- Card 1: สถิติบริษัท -->
        <div class="safety-card">
          <div class="card-header-label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M6 21V11m4 10V11m4 10V11m4 10V11M12 3L2 7h20L12 3z"/></svg>
            <span>สถิติบริษัท</span>
          </div>
          <div class="days-value" id="company-days-count">0</div>
          <div class="days-unit">วันปลอดอุบัติเหตุ</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="company-progress-fill" style="width: 0%;"></div>
          </div>
          <div class="target-badge">
            เป้าหมาย: <strong id="company-target-val">1,200</strong> วัน
          </div>
          <div class="last-date-text" id="company-last-date-text">ล่าสุด -</div>
        </div>

        <!-- Card 2: แผนกซ่อมไฟฟ้า -->
        <div class="safety-card">
          <div class="card-header-label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            <span>แผนกซ่อมไฟฟ้า</span>
          </div>
          <div class="days-value" id="dept-days-count">0</div>
          <div class="days-unit">วันปลอดอุบัติเหตุ</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="dept-progress-fill" style="width: 0%;"></div>
          </div>
          <div class="target-badge">
            เป้าหมาย: <strong id="dept-target-val">3,802</strong> วัน
          </div>
          <div class="last-date-text" id="dept-last-date-text">ล่าสุด -</div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    (function() {
      let announcementsData = [];
      let settingsData = {};
      let lastMediaSignature = '';
      let currentIndex = 0;
      let slideTimer = null;
      const thMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      const thDays = ['วันอาทิตย์ที่', 'วันจันทร์ที่', 'วันอังคารที่', 'วันพุธที่', 'วันพฤหัสบดีที่', 'วันศุกร์ที่', 'วันเสาร์ที่'];

      function init() {
        startClock();
        fetchPublicData();
        setupFullscreen();
        
        // Refresh data every 1 minute to catch updates
        setInterval(fetchPublicData, 60 * 1000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      function startClock() {
        const timeEl = document.getElementById('clock-time');
        const dateEl = document.getElementById('clock-date');

        function update() {
          const now = new Date();
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          const seconds = String(now.getSeconds()).padStart(2, '0');
          timeEl.textContent = `${hours}:${minutes}:${seconds}`;

          const dayName = thDays[now.getDay()];
          const dateNum = now.getDate();
          const monthName = thMonths[now.getMonth()];
          const yearBE = now.getFullYear() + 543;
          dateEl.textContent = `${dayName} ${dateNum} ${monthName} ${yearBE}`;
        }

        update();
        setInterval(update, 1000);
      }

      async function fetchPublicData() {
        try {
          const res = await fetch('/api/v1/announcements/public');
          if (res.ok) {
            const json = await res.json();
            const data = json.data || json;
            if (json.ok || data.success) {
              const newItems = data.announcements || data.items || [];
              settingsData = data.settings || {};
              updateUIWithSettings();

              const newSig = JSON.stringify(newItems.map(i => `${i.id}_${i.updated_at || i.created_at || ''}`));
              if (newSig !== lastMediaSignature) {
                lastMediaSignature = newSig;
                announcementsData = newItems;
                initSlideshow();
              }
            }
          }
        } catch (err) {
          console.error('Fetch public data error:', err);
        }
      }

      function updateUIWithSettings() {
        const mainBody = document.getElementById('tv-main-body');
        const sidebar = document.getElementById('safety-sidebar');
        const clockWrap = document.getElementById('clock-container');

        if (settingsData.show_safety === 0) {
          sidebar.style.display = 'none';
          mainBody.classList.add('no-sidebar');
        } else {
          sidebar.style.display = 'flex';
          mainBody.classList.remove('no-sidebar');

          // Compute days for Company
          const companyLast = settingsData.company_last_incident || '2023-10-28';
          const companyTarget = settingsData.company_target_days || 1200;
          const companyDays = calculateDaysDiff(companyLast);
          document.getElementById('company-days-count').textContent = companyDays.toLocaleString();
          document.getElementById('company-target-val').textContent = companyTarget.toLocaleString();
          document.getElementById('company-progress-fill').style.width = `${Math.min(100, Math.round((companyDays / companyTarget) * 100))}%`;
          document.getElementById('company-last-date-text').textContent = `ล่าสุด ${formatThaiDateStr(companyLast)}`;

          // Compute days for Dept
          const deptLast = settingsData.dept_last_incident || '2016-09-12';
          const deptTarget = settingsData.dept_target_days || 3802;
          const deptDays = calculateDaysDiff(deptLast);
          document.getElementById('dept-days-count').textContent = deptDays.toLocaleString();
          document.getElementById('dept-target-val').textContent = deptTarget.toLocaleString();
          document.getElementById('dept-progress-fill').style.width = `${Math.min(100, Math.round((deptDays / deptTarget) * 100))}%`;
          document.getElementById('dept-last-date-text').textContent = `ล่าสุด ${formatThaiDateStr(deptLast)}`;
        }

        if (settingsData.show_clock === 0) {
          clockWrap.style.display = 'none';
        } else {
          clockWrap.style.display = 'flex';
        }
      }

      function initSlideshow() {
        const container = document.getElementById('slideshow-container');
        const dotsBox = document.getElementById('slideshow-dots');
        const emptyMsg = document.getElementById('empty-msg');

        if (slideTimer) clearTimeout(slideTimer);

        // Remove old slide items
        container.querySelectorAll('.slide-item').forEach(el => el.remove());
        dotsBox.innerHTML = '';

        if (announcementsData.length === 0) {
          emptyMsg.style.display = 'block';
          emptyMsg.textContent = 'ไม่มีสื่อประชาสัมพันธ์ที่เปิดแสดงผลในขณะนี้';
          return;
        }

        emptyMsg.style.display = 'none';

        announcementsData.forEach((item, index) => {
          const slide = document.createElement('div');
          slide.className = `slide-item ${index === 0 ? 'active' : ''}`;
          
          const mediaUrl = `/api/v1/announcements/media/${item.id}`;
          if (item.media_type === 'video') {
            const video = document.createElement('video');
            video.src = mediaUrl;
            video.muted = true;
            video.playsInline = true;
            video.preload = 'auto';
            video.autoplay = (index === 0);
            slide.appendChild(video);
          } else {
            const img = document.createElement('img');
            img.src = mediaUrl;
            img.alt = item.title;
            slide.appendChild(img);
          }

          container.appendChild(slide);

          const dot = document.createElement('div');
          dot.className = `dot ${index === 0 ? 'active' : ''}`;
          dotsBox.appendChild(dot);
        });

        currentIndex = 0;
        scheduleNextSlide();
      }

      function scheduleNextSlide() {
        if (announcementsData.length <= 1) return;

        const currentItem = announcementsData[currentIndex];
        const defaultSec = settingsData.slide_interval_sec || 60;
        let delayMs = defaultSec * 1000;

        // If current slide is a video, wait for it to finish or fallback to interval
        const slides = document.querySelectorAll('.slide-item');
        const activeSlide = slides[currentIndex];
        const video = activeSlide ? activeSlide.querySelector('video') : null;

        if (video) {
          video.currentTime = 0;
          video.play().catch(() => {});
          
          const onEnded = () => {
            video.removeEventListener('ended', onEnded);
            nextSlide();
          };
          video.addEventListener('ended', onEnded);
          return;
        }

        slideTimer = setTimeout(() => {
          nextSlide();
        }, delayMs);
      }

      function nextSlide() {
        const slides = document.querySelectorAll('.slide-item');
        const dots = document.querySelectorAll('.dot');
        if (slides.length === 0) return;

        slides[currentIndex].classList.remove('active');
        const curVideo = slides[currentIndex].querySelector('video');
        if (curVideo) curVideo.pause();

        if (dots[currentIndex]) dots[currentIndex].classList.remove('active');

        currentIndex = (currentIndex + 1) % announcementsData.length;

        slides[currentIndex].classList.add('active');
        if (dots[currentIndex]) dots[currentIndex].classList.add('active');

        scheduleNextSlide();
      }

      function calculateDaysDiff(dateStr) {
        if (!dateStr) return 0;
        const parts = String(dateStr).split('-');
        if (parts.length === 3) {
          const past = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          const now = new Date();
          now.setHours(0, 0, 0, 0);
          const diffTime = Math.max(0, now - past);
          return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }
        const past = new Date(dateStr);
        const now = new Date();
        past.setHours(0, 0, 0, 0);
        now.setHours(0, 0, 0, 0);
        const diffTime = Math.abs(now - past);
        return Math.floor(diffTime / (1000 * 60 * 60 * 24));
      }

      function formatThaiDateStr(dateStr) {
        if (!dateStr) return '-';
        const parts = String(dateStr).split('-');
        if (parts.length === 3) {
          const d = parseInt(parts[2], 10);
          const m = parseInt(parts[1], 10) - 1;
          const y = parseInt(parts[0], 10) + 543;
          return `${d} ${thMonths[m] || ''} ${y}`;
        }
        const d = new Date(dateStr);
        const dateNum = d.getDate();
        const monthName = thMonths[d.getMonth()];
        const yearBE = d.getFullYear() + 543;
        return `${dateNum} ${monthName} ${yearBE}`;
      }

      function setupFullscreen() {
        const btn = document.getElementById('btn-fullscreen');
        btn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.error(err));
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        });
      }
    })();
  </script>
</body>
</html>
