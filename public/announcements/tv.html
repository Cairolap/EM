<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELECTRICAL MAINTENANCE - Public TV Display</title>
  <link rel="icon" type="image/png" href="/Logo%20small.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .tv-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Top Bar Header */
    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 28px;
      background: #090d16;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 1s ease-in-out;
    }

    .tv-header.flipped-header {
      flex-direction: row-reverse;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-transform: uppercase;
      will-change: transform;
    }

    .header-brand svg {
      color: #f59e0b;
    }

    .header-clock {
      display: flex;
      align-items: baseline;
      gap: 14px;
      will-change: transform;
    }

    .clock-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.04em;
    }

    .clock-date {
      font-size: 17px;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Main Split Layout with Anti-Burn-In Inversion */
    .tv-main-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      padding: 20px;
      min-height: 0;
      transition: grid-template-columns 1s ease-in-out, opacity 0.4s ease;
    }

    .tv-main-body.no-sidebar {
      grid-template-columns: 1fr;
    }

    .tv-main-body.flipped-layout {
      grid-template-columns: 340px 1fr;
    }

    .tv-main-body.flipped-layout .safety-sidebar {
      order: 1;
    }

    .tv-main-body.flipped-layout .slideshow-container {
      order: 2;
    }

    /* Left Slideshow Box */
    .slideshow-container {
      position: relative;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }

    .slideshow-container:active {
      cursor: grabbing;
    }

    /* Swipe & Click Navigation Buttons */
    .slide-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 15;
      opacity: 0;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
    }

    .slideshow-container:hover .slide-nav-btn {
      opacity: 0.85;
    }

    .slide-nav-btn:hover {
      opacity: 1 !important;
      background: rgba(15, 23, 42, 0.9);
      transform: translateY(-50%) scale(1.1);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .slide-nav-prev {
      left: 16px;
    }

    .slide-nav-next {
      right: 16px;
    }

    .slide-item {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      pointer-events: none;
    }

    .slide-item.active {
      opacity: 1;
      z-index: 2;
      pointer-events: auto;
    }

    .slide-item img,
    .slide-item video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Slide Navigation Dots Overlay */
    .slideshow-dots {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dot:hover {
      background: rgba(255, 255, 255, 0.7);
    }

    .dot.active {
      background: #38bdf8;
      transform: scale(1.3);
    }

    /* Right Safety Counter Cards Sidebar */
    .safety-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      will-change: transform;
    }

    .pixel-orbit-target {
      will-change: transform;
      transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .safety-card {
      background: linear-gradient(145deg, #0a1120 0%, #0d182b 50%, #0a1120 100%);
      background-size: 200% 200%;
      animation: ambient-card-drift 45s ease infinite;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
    }

    @keyframes ambient-card-drift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card-header-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .days-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 58px;
      font-weight: 800;
      color: #22c55e;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    .days-unit {
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 16px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      background-size: 250% 100% !important;
      animation: progress-wave 4s infinite ease-in-out;
    }

    /* Living Shimmer Highlight Effect (การเคลื่อนไหวของแถบ) */
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      width: 100%;
      height: 100%;
      animation: progress-shimmer 2.4s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes progress-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes progress-wave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .target-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13.5px;
      color: #e2e8f0;
    }

    .target-badge strong {
      color: #38bdf8;
    }

    .last-date-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
    }

    .empty-slide-msg {
      color: #64748b;
      font-size: 18px;
      text-align: center;
    }

    /* Fullscreen Toggle Button */
    .fullscreen-btn {
      background: rgba(15, 23, 42, 0.7);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .fullscreen-btn:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(15, 23, 42, 0.95);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="tv-wrapper">
    <!-- Header -->
    <header class="tv-header" id="tv-header">
      <div class="header-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>ELECTRICAL MAINTENANCE</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="header-clock" id="clock-container">
          <div class="clock-time" id="clock-time">00:00:00</div>
          <div class="clock-date" id="clock-date">--</div>
        </div>
        <button class="fullscreen-btn" id="btn-fullscreen" title="ขยายเต็มหน้าจอ (Toggle Fullscreen)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="tv-main-body" id="tv-main-body">
      <!-- Left Slideshow -->
      <div class="slideshow-container" id="slideshow-container">
        <button type="button" class="slide-nav-btn slide-nav-prev" id="slide-btn-prev" aria-label="ย้อนกลับ (Previous slide)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button type="button" class="slide-nav-btn slide-nav-next" id="slide-btn-next" aria-label="ถัดไป (Next slide)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <div class="empty-slide-msg" id="empty-msg">กำลังโหลดข้อมูลสื่อ...</div>
        <div class="slideshow-dots" id="slideshow-dots"></div>
      </div>

      <!-- Right Safety Counter -->
      <aside class="safety-sidebar" id="safety-sidebar">
        <!-- Card 1: สถิติบริษัท -->
        <div class="safety-card">
          <div class="card-header-label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M6 21V11m4 10V11m4 10V11m4 10V11M12 3L2 7h20L12 3z"/></svg>
            <span>สถิติบริษัท</span>
          </div>
          <div class="days-value" id="company-days-count">0</div>
          <div class="days-unit">วันปลอดอุบัติเหตุ</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="company-progress-fill" style="width: 0%;"></div>
          </div>
          <div class="target-badge">
            เป้าหมาย: <strong id="company-target-val">1,200</strong> วัน
          </div>
          <div class="last-date-text" id="company-last-date-text">ล่าสุด -</div>
        </div>

        <!-- Card 2: แผนกซ่อมไฟฟ้า -->
        <div class="safety-card">
          <div class="card-header-label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            <span>แผนกซ่อมไฟฟ้า</span>
          </div>
          <div class="days-value" id="dept-days-count">0</div>
          <div class="days-unit">วันปลอดอุบัติเหตุ</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="dept-progress-fill" style="width: 0%;"></div>
          </div>
          <div class="target-badge">
            เป้าหมาย: <strong id="dept-target-val">3,802</strong> วัน
          </div>
          <div class="last-date-text" id="dept-last-date-text">ล่าสุด -</div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    (function() {
      let announcementsData = [];
      let settingsData = {};
      let lastMediaSignature = '';
      let currentIndex = 0;
      let slideTimer = null;
      let lastForceTime = 0;
      const thMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      const thDays = ['วันอาทิตย์ที่', 'วันจันทร์ที่', 'วันอังคารที่', 'วันพุธที่', 'วันพฤหัสบดีที่', 'วันศุกร์ที่', 'วันเสาร์ที่'];

      const tvBroadcastChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('em_tv_channel') : null;
      if (tvBroadcastChannel) {
        tvBroadcastChannel.onmessage = (e) => {
          if (e.data?.type === 'force_slide' && e.data?.media_id) {
            jumpToMediaId(e.data.media_id);
          }
        };
      }

      function init() {
        startClock();
        fetchPublicData();
        setupFullscreen();
        setupNavigation();
        setupTouchGestures();
        setupAntiBurnIn();
        
        // Fast state polling every 2 seconds for instant reaction to "แสดงตอนนี้"
        setInterval(fetchStateSync, 2000);

        // Refresh public data every 45 seconds to catch new uploads
        setInterval(fetchPublicData, 45 * 1000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      async function fetchStateSync() {
        try {
          const res = await fetch('/api/v1/announcements/state');
          if (res.ok) {
            const json = await res.json();
            const state = json.data || {};
            if (state.force_timestamp && state.force_timestamp > lastForceTime) {
              lastForceTime = state.force_timestamp;
              if (state.force_media_id) {
                jumpToMediaId(state.force_media_id);
              }
            }
          }
        } catch (_) {}
      }

      function jumpToMediaId(mediaId) {
        const idx = announcementsData.findIndex(item => item.id === mediaId);
        if (idx !== -1) {
          goToSlide(idx);
        } else {
          fetchPublicData().then(() => {
            const newIdx = announcementsData.findIndex(item => item.id === mediaId);
            if (newIdx !== -1) goToSlide(newIdx);
          });
        }
      }

      const dailyThemes = [
        { // 0: วันอาทิตย์ (สีแดง)
          name: 'วันอาทิตย์ (สีแดง)',
          barGradient: 'linear-gradient(90deg, #b91c1c, #ef4444, #f87171, #ef4444)',
          textColor: '#ef4444',
          glow: 'rgba(239, 68, 68, 0.45)'
        },
        { // 1: วันจันทร์ (สีเหลือง)
          name: 'วันจันทร์ (สีเหลือง)',
          barGradient: 'linear-gradient(90deg, #d97706, #eab308, #fef08a, #eab308)',
          textColor: '#facc15',
          glow: 'rgba(250, 204, 21, 0.45)'
        },
        { // 2: วันอังคาร (สีชมพู)
          name: 'วันอังคาร (สีชมพู)',
          barGradient: 'linear-gradient(90deg, #be185d, #ec4899, #fbcfe8, #ec4899)',
          textColor: '#f472b6',
          glow: 'rgba(236, 72, 153, 0.45)'
        },
        { // 3: วันพุธ (สีเขียว)
          name: 'วันพุธ (สีเขียว)',
          barGradient: 'linear-gradient(90deg, #047857, #10b981, #a7f3d0, #10b981)',
          textColor: '#22c55e',
          glow: 'rgba(34, 197, 94, 0.45)'
        },
        { // 4: วันพฤหัสบดี (สีส้ม)
          name: 'วันพฤหัสบดี (สีส้ม)',
          barGradient: 'linear-gradient(90deg, #c2410c, #f97316, #fed7aa, #f97316)',
          textColor: '#fb923c',
          glow: 'rgba(251, 146, 60, 0.45)'
        },
        { // 5: วันศุกร์ (สีฟ้า)
          name: 'วันศุกร์ (สีฟ้า)',
          barGradient: 'linear-gradient(90deg, #0369a1, #0ea5e9, #bae6fd, #0ea5e9)',
          textColor: '#38bdf8',
          glow: 'rgba(56, 189, 248, 0.45)'
        },
        { // 6: วันเสาร์ (สีม่วง)
          name: 'วันเสาร์ (สีม่วง)',
          barGradient: 'linear-gradient(90deg, #7e22ce, #a855f7, #e9d5ff, #a855f7)',
          textColor: '#c084fc',
          glow: 'rgba(192, 132, 252, 0.45)'
        }
      ];

      let lastAppliedDay = -1;
      function applyDailyColorTheme() {
        const now = new Date();
        const day = now.getDay();
        if (day === lastAppliedDay) return;
        lastAppliedDay = day;

        const theme = dailyThemes[day] || dailyThemes[3];
        
        // Update animated progress bar fills with daily color theme
        document.querySelectorAll('.progress-bar-fill').forEach(bar => {
          bar.style.background = theme.barGradient;
          bar.style.boxShadow = `0 0 14px ${theme.glow}`;
        });

        // Update big day count values with matching vibrant color & glow
        document.querySelectorAll('.days-value').forEach(val => {
          val.style.color = theme.textColor;
          val.style.textShadow = `0 0 25px ${theme.glow}`;
        });
      }

      function startClock() {
        const timeEl = document.getElementById('clock-time');
        const dateEl = document.getElementById('clock-date');

        function update() {
          const now = new Date();
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          const seconds = String(now.getSeconds()).padStart(2, '0');
          timeEl.textContent = `${hours}:${minutes}:${seconds}`;

          const dayName = thDays[now.getDay()];
          const dateNum = now.getDate();
          const monthName = thMonths[now.getMonth()];
          const yearBE = now.getFullYear() + 543;
          dateEl.textContent = `${dayName} ${dateNum} ${monthName} ${yearBE}`;

          applyDailyColorTheme();
        }

        update();
        setInterval(update, 1000);
      }

      async function fetchPublicData() {
        try {
          const res = await fetch('/api/v1/announcements/public');
          if (res.ok) {
            const json = await res.json();
            const data = json.data || json;
            if (json.ok || data.success) {
              const allItems = data.announcements || data.items || [];
              const newItems = allItems.filter(item => item.is_active !== false && item.isActive !== false);
              settingsData = data.settings || {};
              updateUIWithSettings();

              const newSig = JSON.stringify(newItems.map(i => `${i.id}_${i.updated_at || i.created_at || ''}`));
              if (newSig !== lastMediaSignature) {
                lastMediaSignature = newSig;
                announcementsData = newItems;
                initSlideshow();
              }
            }
          }
        } catch (err) {
          console.error('Fetch public data error:', err);
        }
      }

      function updateUIWithSettings() {
        const mainBody = document.getElementById('tv-main-body');
        const sidebar = document.getElementById('safety-sidebar');
        const clockWrap = document.getElementById('clock-container');

        if (settingsData.show_safety === 0) {
          sidebar.style.display = 'none';
          mainBody.classList.add('no-sidebar');
        } else {
          sidebar.style.display = 'flex';
          mainBody.classList.remove('no-sidebar');

          // Compute days for Company
          const companyLast = settingsData.company_last_incident || '2023-10-28';
          const companyTarget = settingsData.company_target_days || 1200;
          const companyDays = calculateDaysDiff(companyLast);
          document.getElementById('company-days-count').textContent = companyDays.toLocaleString();
          document.getElementById('company-target-val').textContent = companyTarget.toLocaleString();
          document.getElementById('company-progress-fill').style.width = `${Math.min(100, Math.round((companyDays / companyTarget) * 100))}%`;
          document.getElementById('company-last-date-text').textContent = `ล่าสุด ${formatThaiDateStr(companyLast)}`;

          // Compute days for Dept
          const deptLast = settingsData.dept_last_incident || '2016-09-12';
          const deptTarget = settingsData.dept_target_days || 3802;
          const deptDays = calculateDaysDiff(deptLast);
          document.getElementById('dept-days-count').textContent = deptDays.toLocaleString();
          document.getElementById('dept-target-val').textContent = deptTarget.toLocaleString();
          document.getElementById('dept-progress-fill').style.width = `${Math.min(100, Math.round((deptDays / deptTarget) * 100))}%`;
          document.getElementById('dept-last-date-text').textContent = `ล่าสุด ${formatThaiDateStr(deptLast)}`;
        }

        if (settingsData.show_clock === 0) {
          clockWrap.style.display = 'none';
        } else {
          clockWrap.style.display = 'flex';
        }
      }

      function initSlideshow() {
        const container = document.getElementById('slideshow-container');
        const dotsBox = document.getElementById('slideshow-dots');
        const emptyMsg = document.getElementById('empty-msg');

        if (slideTimer) clearTimeout(slideTimer);

        // Remove old slide items
        container.querySelectorAll('.slide-item').forEach(el => el.remove());
        dotsBox.innerHTML = '';

        if (announcementsData.length === 0) {
          emptyMsg.style.display = 'block';
          emptyMsg.textContent = 'ไม่มีสื่อประชาสัมพันธ์ที่เปิดแสดงผลในขณะนี้';
          return;
        }

        emptyMsg.style.display = 'none';

        announcementsData.forEach((item, index) => {
          const slide = document.createElement('div');
          slide.className = `slide-item ${index === 0 ? 'active' : ''}`;
          
          const mediaUrl = `/api/v1/announcements/media/${item.id}?v=${encodeURIComponent(item.updated_at || item.created_at || '1')}`;
          if (item.media_type === 'video') {
            const video = document.createElement('video');
            video.src = mediaUrl;
            video.muted = true;
            video.setAttribute('muted', '');
            video.playsInline = true;
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.preload = 'auto';
            slide.appendChild(video);
          } else {
            const img = document.createElement('img');
            img.src = mediaUrl;
            img.alt = item.title;
            slide.appendChild(img);
          }

          container.appendChild(slide);

          const dot = document.createElement('div');
          dot.className = `dot ${index === 0 ? 'active' : ''}`;
          dot.setAttribute('title', `ไปยังสไลด์ที่ ${index + 1}`);
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            goToSlide(index);
          });
          dotsBox.appendChild(dot);
        });

        currentIndex = 0;
        scheduleNextSlide();
      }

      function scheduleNextSlide() {
        if (announcementsData.length <= 1) return;

        if (slideTimer) {
          clearTimeout(slideTimer);
          slideTimer = null;
        }

        const defaultSec = settingsData.slide_interval_sec || 60;
        let delayMs = defaultSec * 1000;

        const slides = document.querySelectorAll('.slide-item');
        const activeSlide = slides[currentIndex];
        const video = activeSlide ? activeSlide.querySelector('video') : null;

        if (video) {
          let hasAdvanced = false;

          function cleanup() {
            video.removeEventListener('ended', onAdvance);
            video.removeEventListener('error', onAdvance);
            video.removeEventListener('timeupdate', onTimeUpdate);
          }

          function onAdvance() {
            if (hasAdvanced) return;
            hasAdvanced = true;
            cleanup();
            if (slideTimer) {
              clearTimeout(slideTimer);
              slideTimer = null;
            }
            nextSlide();
          }

          function onTimeUpdate() {
            if (video.duration && isFinite(video.duration) && video.duration > 0) {
              if (video.currentTime >= video.duration - 0.4) {
                onAdvance();
              }
            }
          }

          video.addEventListener('ended', onAdvance);
          video.addEventListener('error', onAdvance);
          video.addEventListener('timeupdate', onTimeUpdate);

          // Reset time and trigger playback
          try {
            if (video.currentTime > 0) video.currentTime = 0;
          } catch (_) {}

          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch((err) => {
              console.warn('Video play deferred or blocked:', err);
            });
          }

          // Fallback Timer:
          // If video.duration is available, give it duration + 1.5s
          // Otherwise wait for loadedmetadata or use delayMs
          function setFallback() {
            let timeoutMs = delayMs;
            if (video.duration && isFinite(video.duration) && !isNaN(video.duration) && video.duration > 0) {
              timeoutMs = Math.ceil(video.duration * 1000) + 1500;
            }
            if (slideTimer) clearTimeout(slideTimer);
            slideTimer = setTimeout(onAdvance, timeoutMs);
          }

          if (video.readyState >= 1 && video.duration) {
            setFallback();
          } else {
            video.addEventListener('loadedmetadata', setFallback, { once: true });
            slideTimer = setTimeout(onAdvance, delayMs);
          }

          return;
        }

        // Image slide: transition after delayMs
        slideTimer = setTimeout(() => {
          nextSlide();
        }, delayMs);
      }

      function prevSlide() {
        if (announcementsData.length <= 1) return;
        const target = (currentIndex - 1 + announcementsData.length) % announcementsData.length;
        goToSlide(target);
      }

      function nextSlide() {
        if (announcementsData.length <= 1) return;
        const target = (currentIndex + 1) % announcementsData.length;
        goToSlide(target);
      }

      function goToSlide(targetIndex) {
        if (slideTimer) {
          clearTimeout(slideTimer);
          slideTimer = null;
        }

        const slides = document.querySelectorAll('.slide-item');
        const dots = document.querySelectorAll('.dot');
        if (slides.length === 0) return;

        // Pause and reset previous video
        const curVideo = slides[currentIndex]?.querySelector('video');
        if (curVideo) {
          try {
            curVideo.pause();
            if (curVideo.currentTime > 0) curVideo.currentTime = 0;
          } catch (_) {}
        }

        slides[currentIndex]?.classList.remove('active');
        if (dots[currentIndex]) dots[currentIndex].classList.remove('active');

        currentIndex = targetIndex;

        slides[currentIndex]?.classList.add('active');
        if (dots[currentIndex]) dots[currentIndex].classList.add('active');

        const currentItem = announcementsData[currentIndex];
        if (currentItem) {
          if (tvBroadcastChannel) {
            try { tvBroadcastChannel.postMessage({ type: 'slide_change', media_id: currentItem.id }); } catch (_) {}
          }
          fetch('/api/v1/announcements/current', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ media_id: currentItem.id })
          }).catch(() => {});
        }

        scheduleNextSlide();
        triggerAntiBurnPulse();
      }

      function setupNavigation() {
        const btnPrev = document.getElementById('slide-btn-prev');
        const btnNext = document.getElementById('slide-btn-next');
        if (btnPrev) btnPrev.addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
        if (btnNext) btnNext.addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
      }

      function setupTouchGestures() {
        const container = document.getElementById('slideshow-container');
        let startX = 0;
        let startY = 0;
        let isTouching = false;

        // Touch events for touchscreen TV / tablet / mobile
        container.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isTouching = true;
          }
        }, { passive: true });

        container.addEventListener('touchend', (e) => {
          if (!isTouching || e.changedTouches.length === 0) return;
          isTouching = false;
          const deltaX = e.changedTouches[0].clientX - startX;
          const deltaY = e.changedTouches[0].clientY - startY;

          // If horizontal swipe is prominent (> 40px) and mostly horizontal
          if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
            if (deltaX < 0) {
              nextSlide(); // Swipe Left -> Next Slide
            } else {
              prevSlide(); // Swipe Right -> Prev Slide
            }
          }
        }, { passive: true });

        // Mouse Drag / Air-Mouse support
        let mouseStartX = 0;
        let isMouseDown = false;
        container.addEventListener('mousedown', (e) => {
          if (e.target.closest('.slide-nav-btn') || e.target.closest('.slideshow-dots')) return;
          mouseStartX = e.clientX;
          isMouseDown = true;
        });

        window.addEventListener('mouseup', (e) => {
          if (!isMouseDown) return;
          isMouseDown = false;
          const deltaX = e.clientX - mouseStartX;
          if (Math.abs(deltaX) > 50) {
            if (deltaX < 0) nextSlide();
            else prevSlide();
          }
        });
      }

      function calculateDaysDiff(dateStr) {
        if (!dateStr) return 0;
        const parts = String(dateStr).split('-');
        if (parts.length === 3) {
          const past = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          const now = new Date();
          now.setHours(0, 0, 0, 0);
          const diffTime = Math.max(0, now - past);
          return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }
        const past = new Date(dateStr);
        const now = new Date();
        past.setHours(0, 0, 0, 0);
        now.setHours(0, 0, 0, 0);
        const diffTime = Math.abs(now - past);
        return Math.floor(diffTime / (1000 * 60 * 60 * 24));
      }

      function formatThaiDateStr(dateStr) {
        if (!dateStr) return '-';
        const parts = String(dateStr).split('-');
        if (parts.length === 3) {
          const d = parseInt(parts[2], 10);
          const m = parseInt(parts[1], 10) - 1;
          const y = parseInt(parts[0], 10) + 543;
          return `${d} ${thMonths[m] || ''} ${y}`;
        }
        const d = new Date(dateStr);
        const dateNum = d.getDate();
        const monthName = thMonths[d.getMonth()];
        const yearBE = d.getFullYear() + 543;
        return `${dateNum} ${monthName} ${yearBE}`;
      }

      function triggerAntiBurnPulse() {
        document.querySelectorAll('.safety-card').forEach(card => {
          card.style.opacity = '0.9';
          setTimeout(() => { card.style.opacity = '1'; }, 350);
        });
      }

      function setupAntiBurnIn() {
        const mainBody = document.getElementById('tv-main-body');
        const header = document.getElementById('tv-header');
        const sidebar = document.getElementById('safety-sidebar');
        const clock = document.getElementById('clock-container');
        const brand = document.querySelector('.header-brand');
        const dots = document.getElementById('slideshow-dots');

        // Add class for smooth micro-translation
        [sidebar, clock, brand, dots].forEach(el => {
          if (el) el.classList.add('pixel-orbit-target');
        });

        // 1. Micro Pixel Orbiting: Subtly shifts X/Y coordinates every 60s (±6px / ±5px)
        function performPixelOrbit() {
          const sx = Math.round((Math.random() - 0.5) * 12);
          const sy = Math.round((Math.random() - 0.5) * 10);

          if (sidebar) sidebar.style.transform = `translate3d(${sx}px, ${sy}px, 0)`;
          if (clock) clock.style.transform = `translate3d(${-sx}px, ${sy}px, 0)`;
          if (brand) brand.style.transform = `translate3d(${Math.round(sx / 2)}px, ${-Math.round(sy / 2)}px, 0)`;
          if (dots) dots.style.transform = `translateX(calc(-50% + ${sx}px)) translateY(${sy}px)`;
        }

        setInterval(performPixelOrbit, 60 * 1000);
        performPixelOrbit();

        // 2. Macro Layout Shift (สลับฝั่งซ้าย <-> ขวา) ทุกๆ 10 นาที
        let isFlipped = false;
        function performMacroLayoutShift() {
          isFlipped = !isFlipped;
          if (mainBody) {
            mainBody.style.opacity = '0.4';
            setTimeout(() => {
              if (isFlipped) {
                mainBody.classList.add('flipped-layout');
                header?.classList.add('flipped-header');
              } else {
                mainBody.classList.remove('flipped-layout');
                header?.classList.remove('flipped-header');
              }
              mainBody.style.opacity = '1';
            }, 400);
          }
        }

        // Toggle layout every 10 minutes (600,000 ms)
        setInterval(performMacroLayoutShift, 10 * 60 * 1000);
      }

      function setupFullscreen() {
        const btn = document.getElementById('btn-fullscreen');
        btn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.error(err));
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        });
      }
    })();
  </script>
